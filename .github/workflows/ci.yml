name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: luciferus
          POSTGRES_PASSWORD: luciferus
          POSTGRES_DB: luciferus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luciferus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://luciferus:luciferus@localhost:5432/luciferus
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Тесты работают против настоящей базы, поэтому схема и сиды должны быть
      # готовы ДО прогона — иначе интеграционные тесты упадут на пустой базе.
      - name: Migrate database
        run: bun run db:migrate

      - name: Seed database
        run: bun run db:seed

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Сборка ловит то, что не видят тесты: ошибки Next.js на этапе
      # пререндера, проблемы со сборкой SDK. Без неё поломка всплыла бы
      # только при деплое.
      - name: Build
        run: bun run build
