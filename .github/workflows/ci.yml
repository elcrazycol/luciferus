name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: luciferus
          POSTGRES_PASSWORD: luciferus
          POSTGRES_DB: luciferus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luciferus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Именно 127.0.0.1, а не localhost: на раннере localhost может разрешаться
      # в ::1 первым, и подключение к проброшенному порту docker отваливается.
      DATABASE_URL: postgres://luciferus:luciferus@127.0.0.1:5432/luciferus
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Диагностика: если сервисы не отвечают, в логе видно только ECONNREFUSED
      # и непонятно, виноват адрес, драйвер, окружение или контейнер.
      - name: Check service connectivity
        run: |
          set +e
          echo "— версия Bun: $(bun --version)"
          echo "— DATABASE_URL в окружении: $DATABASE_URL"
          echo "— куда подключается само приложение:"
          bun -e 'const { serverConfig } = await import("./packages/config/src/server.ts"); console.log("   " + serverConfig.databaseUrl)'
          echo "— сырое TCP-подключение из Bun, IPv4:"
          bun -e 'try { await Bun.connect({ hostname: "127.0.0.1", port: 5432, socket: { data() {} } }); console.log("   ok") } catch (e) { console.log("   fail:", e.code ?? e.message) }'
          echo "— подключение драйвером из пакета db:"
          (cd packages/db && bun -e 'const postgres = (await import("postgres")).default; const sql = postgres(process.env.DATABASE_URL, { max: 1 }); try { const rows = await sql`select current_user, current_database()`; console.log("   ok:", rows[0]) } catch (e) { console.log("   fail:", e.code, e.message) } finally { await sql.end() }')
          echo "— что видит сам контейнер:"
          docker exec "$(docker ps --filter 'name=postgres' --format '{{.ID}}' | head -1)" psql -U luciferus -d luciferus -c "select current_user, current_database();"

      # Тесты работают против настоящей базы, поэтому схема и сиды должны быть
      # готовы ДО прогона — иначе интеграционные тесты упадут на пустой базе.
      - name: Migrate database
        run: bun run db:migrate

      - name: Seed database
        run: bun run db:seed

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Сборка ловит то, что не видят тесты: ошибки Next.js на этапе
      # пререндера, проблемы со сборкой SDK. Без неё поломка всплыла бы
      # только при деплое.
      - name: Build
        run: bun run build
