name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: luciferus
          POSTGRES_PASSWORD: luciferus
          POSTGRES_DB: luciferus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luciferus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Именно 127.0.0.1, а не localhost: на раннере localhost может разрешаться
      # в ::1 первым, и подключение к проброшенному порту docker отваливается.
      DATABASE_URL: postgres://luciferus:luciferus@127.0.0.1:5432/luciferus
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Если сервисы вдруг не отвечают, этот шаг покажет причину. Без него в логе
      # видно только ECONNREFUSED и непонятно, кто виноват: адрес, окружение
      # или контейнер. Именно так и нашлась потеря DATABASE_URL в turbo.
      - name: Check service connectivity
        run: |
          set +e
          echo "Bun $(bun --version), DATABASE_URL=$DATABASE_URL"
          echo "приложение подключается к:"
          bun -e 'const { serverConfig } = await import("./packages/config/src/server.ts"); console.log("  " + serverConfig.databaseUrl)'

      # Тесты работают против настоящей базы, поэтому схема и сиды должны быть
      # готовы ДО прогона — иначе интеграционные тесты упадут на пустой базе.
      - name: Migrate database
        run: bun run db:migrate

      - name: Seed database
        run: bun run db:seed

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Сборка ловит то, что не видят тесты: ошибки Next.js на этапе
      # пререндера, проблемы со сборкой SDK. Без неё поломка всплыла бы
      # только при деплое.
      - name: Build
        run: bun run build
